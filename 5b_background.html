



<!DOCTYPE html>

<html>

<head>

   <title>Tilted Flower Background</title>

   <style>

      body {

          margin: 0;
           min-height: 200vh; /* for scrolling */

        font-family: Arial, sans-serif;

           text-align: center;

           position: relative;

       }



     /* Background image layer */

    body::before {

      content: " ";
        position: fixed;
      top: 50%;

        left: 50%;
        width: 400px;

     height: 400px;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Rosa_Precious_platinum.jpg/500px-Rosa_Precious_platinum.jpg");
     background-size: cover;
        background-repeat: no-repeat;
       transform: translate(-50%, -50%) skewX(5deg); 
      opacity: 2;
     z-index: -1; 
     }

       h1 {
       margin-top: 50px;
   }
    p {

       width: 60%;

       margin: auto;
      font-size: 18px;

    }
   </style>

</head>



<body>



  <h1>Flower image </h1>

 <p>

    Scroll the page.  

     The flower image stays fixed in the middle and is tilted,  
    but the text is normal.++

 </p>



  <p style="margin-top:800px;">

      Extra content to enable scrolling.  

       Image does not move while scrolling.

  </p>



</body>

</html>
