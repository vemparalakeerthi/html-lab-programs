<!DOCTYPE html>
<html>
<head>
  <title>Three Column Layout</title>
<style>
    .container {
      display: flex;
      height: 100vh;
    }
    .section {
      flex: 1;
      border: 2px solid blue;
      padding: 15px;
      text-align: center;
    }
  </style>

  </head>
<body>

<div class="container">

  <!-- Section 1 : Image -->
  <div class="section">
    <h3>My Image</h3>
    <img src="C:\Users\vempa\Desktop\html\Screenshots\sofia.png" width="200" height="400" alt="sofia Image">
  </div>

  <!-- Section 2 : Description -->
  <div class="section">
    <h3>About Me</h3>
    <p>
      I am a student of Cyber security.  
      This page is designed using Flexbox instead of frames.
    </p>
  </div>

  <!-- Section 3 : Hyperlink -->
  <div class="section">
    <h3>Useful Link</h3>
    <a href="https://www.wikipedia.org" target="_blank">
      Visit Wikipedia
    </a>
  </div>

</div>

</body>
</html>
