
<html>
<head>
<title>JavaScript Functions</title>
</head>

<body>

<script>

var n = 5;

// Factorial
function factorial(num){
    var fact = 1;
    for(var i = 1; i <= num; i++){
        fact = fact * i;
    }
    console.log("Factorial of " + num + " is " + fact);
}

// Fibonacci
function fibonacci(num){
    var a = 0, b = 1, c;
    console.log("Fibonacci series:");
    console.log(a);
    console.log(b);

    for(var i = 2; i < num; i++){
        c = a + b;
        console.log(c);
        a = b;
        b = c;
    }
}

// Prime numbers
function prime(num){
    console.log("Prime numbers up to " + num + " are:");
    
    for(var i = 2; i <= num; i++){
        var count = 0;
        
        for(var j = 1; j <= i; j++){
            if(i % j == 0){
                count++;
            }
        }

        if(count == 2){
            console.log(i);
        }
    }
}

// Palindrome
function palindrome(num){
    var temp = num;
    var rev = 0;

    while(num > 0){
        var r = num % 10;
        rev = rev * 10 + r;
        num = Math.floor(num / 10);
    }

    if(temp == rev)
        console.log(temp + " is Palindrome");
    else
        console.log(temp + " is Not Palindrome");
}

// Function calls
factorial(n);
fibonacci(n);
prime(n);
palindrome(n);

</script>

</body>
</html>
